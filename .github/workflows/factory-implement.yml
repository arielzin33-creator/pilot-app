# factory-implement: one ready issue -> verified draft pull request (Phase A loop).
#
# Jobs and trust boundaries (spec §3, §4, §5, §6):
#   preflight  read-only token; STOP_IF; selects the item. No agent.
#   implement  agent edits files in a sandbox with no network; Anthropic access by workload
#              identity federation (no API key); the diff is checked by the trusted engine copy.
#   claim      labels the item factory:in-progress (issues: write only).
#   holdouts   optional: fetches hidden acceptance scenarios with a read-only App token; no agent code.
#   gates      NO secrets and no id-token (holdouts arrive as an artifact). Authoritative: checks the patch hash, re-runs the diff
#              policy with the base's engine before any agent code runs, then runs gates and the
#              failing-test proof inside a bubblewrap sandbox (no network, read-only filesystem
#              except the checkout) so code under test cannot alter the verdict or the evidence.
#   verify     a different model reads the change cold (advisory in Phase A).
#   publish    deterministic: claim branch, commit with trailers, draft PR, status, labels, ledger.
# A human reviews and merges. Nothing in this workflow can merge.
#
# Pins: actions are pinned to full commit SHAs (verified 2026-11-04). The Claude action is pinned
# to the commit that contains workload identity federation (see docs/factory/DECISIONS.md).

name: factory-implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (blank = oldest ready issue)"
        required: false
        default: ""
  schedule:
    - cron: "17 6-18 * * 1-5"   # hourly on weekdays (UTC); the factory must be fed (spec §9.5)

permissions: {}

concurrency:
  group: factory-implement
  cancel-in-progress: false

env:
  CLAUDE_ACTION_SHA: c0949c50a78c1ec8ce2647db36629b870e715d0c

jobs:
  preflight:
    if: github.event_name != 'issues' || github.event.label.name == 'factory:ready-to-implement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      proceed: ${{ steps.stop.outputs.proceed }}
      issue: ${{ steps.stop.outputs.issue }}
      reasons: ${{ steps.stop.outputs.reasons }}
      item_specific: ${{ steps.stop.outputs.item_specific }}
      allowed_tier: ${{ steps.stop.outputs.allowed_tier }}
    steps:
      - name: Refuse static Anthropic credentials
        run: |
          test -z "${ANTHROPIC_API_KEY:-}" || { echo "::error::ANTHROPIC_API_KEY must not exist (federation only)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Configuration trust check (hashes) and long-lived key scan
        run: |
          python3 -I .factory/scripts/factory.py config-hashes
          python3 -I .factory/scripts/factory.py scan-keys
      - name: Collect state
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}
          REQUESTED: ${{ github.event.issue.number || inputs.issue || 'auto' }}
        run: |
          bash .factory/scripts/collect-state.sh "${REQUESTED:-auto}" "$RUNNER_TEMP/state"
      - name: STOP_IF
        id: stop
        run: |
          set +e
          python3 -I .factory/scripts/factory.py stop-if --state "$RUNNER_TEMP/state/state.json" > "$RUNNER_TEMP/state/stop.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/state/stop.json"
          issue="$(cat "$RUNNER_TEMP/state/selected.txt")"
          reasons="$(python3 -I -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["reasons"]))' "$RUNNER_TEMP/state/stop.json")"
          # Global reasons do not mark the item as needing a human.
          item_specific="false"
          for r in ${reasons//,/ }; do
            case "$r" in
              NEEDS_HUMAN_LABEL|HANDOFF_MISSING|AMBIGUOUS|LOAD_BEARING_EXPECTED|TIER_NOT_UNATTENDED|SPEC_NOT_APPROVED|RED_GATES_TWICE|TOO_MANY_RUNS|TOO_MANY_CI_FIX) item_specific="true" ;;
            esac
          done
          [ -n "$issue" ] || item_specific="false"
          case " ${reasons//,/ } " in *" NEEDS_HUMAN_LABEL "*) item_specific="false" ;; esac
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "reasons=$reasons" >> "$GITHUB_OUTPUT"
          echo "item_specific=$item_specific" >> "$GITHUB_OUTPUT"
          echo "allowed_tier=$(python3 -I -c 'import json,sys; v=json.load(open(sys.argv[1])).get("allowed_tier"); print(int(v) if v is not None else 0)' "$RUNNER_TEMP/state/stop.json")" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; else echo "proceed=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### STOP_IF"
            echo ""
            echo "Issue: ${issue:-none}  ·  Stop reasons: ${reasons:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-${{ github.run_id }}
          path: ${{ runner.temp }}/state
          retention-days: 14

  stopped:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'false' && needs.preflight.outputs.item_specific == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Hand the item to a human
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          REASONS: ${{ needs.preflight.outputs.reasons }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --add-label factory:needs-human \
            --remove-label factory:ready-to-implement --remove-label factory:in-progress || true
          gh issue comment "$ISSUE" -R "$REPO" --body "The factory stopped before working on this item: \`$REASONS\`. A human decides the next step (see docs/factory/CHARTER.md §7). Run: $RUN_URL"

  claim:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Label the item factory:in-progress (CLAIMED_ELSEWHERE for other runs)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" -R "$REPO" --add-label factory:in-progress

  implement:
    needs: [preflight, claim]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45            # supervisor wall-clock cap; Claude Code has none (spec §4.3)
    permissions:
      contents: read
      id-token: write              # GitHub OIDC -> Anthropic workload identity federation
    outputs:
      patch_bytes: ${{ steps.diff.outputs.patch_bytes }}
      patch_sha256: ${{ steps.diff.outputs.patch_sha256 }}
      diff_ok: ${{ steps.diff.outputs.ok }}
      gate_level: ${{ steps.diff.outputs.gate_level }}
      tier: ${{ steps.diff.outputs.tier }}
      tests_only: ${{ steps.diff.outputs.tests_only }}
      agent_failed: ${{ steps.record.outputs.agent_failed }}
      agent_status: ${{ steps.collect.outputs.agent_status }}
      base_sha: ${{ steps.base.outputs.sha }}
    env:
      FACTORY_RUN: "1"
      ISSUE: ${{ needs.preflight.outputs.issue }}
    steps:
      - name: Refuse static Anthropic credentials
        run: |
          test -z "${ANTHROPIC_API_KEY:-}" || { echo "::error::ANTHROPIC_API_KEY must not exist (federation only)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Record base and copy the trusted engine
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/run"
          cp -R .factory "$RUNNER_TEMP/trusted/.factory"
          # Git metadata as it was before the agent: post-agent git commands use this copy, so
          # nothing the agent or its tests write under .git (config, hooks) is ever executed.
          cp -a .git "$RUNNER_TEMP/trusted/git"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/base_sha.txt"
      - name: Configuration trust check before the agent starts
        run: python3 -I .factory/scripts/factory.py config-hashes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: state-${{ github.run_id }}
          path: ${{ runner.temp }}/state
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies before the agent (the agent has no network)
        run: npm ci --ignore-scripts       # no install scripts while id-token is available
      - name: Prepare the Linux sandbox (bubblewrap, socat)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-net true && echo "bubblewrap OK"
      - name: Read policy values
        id: policy
        run: |
          python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open(".factory/policy.json"))
          print("model=" + p["models"]["implementer"])
          print("budget=" + str(p["limits"]["per_run_budget_usd"]))
          print("turns=" + str(p["limits"]["per_run_max_turns"]))
          EOF
          echo "IMPLEMENT_SCHEMA=$(cat .factory/schemas/implement.schema.min.json)" >> "$GITHUB_ENV"
          # Sandbox paths are written absolute (relative ones are unreliable with --settings).
          python3 -I .factory/scripts/factory.py render-settings --in .factory/worker-settings.json \
            --out "$RUNNER_TEMP/run/worker-settings.json" --root "$GITHUB_WORKSPACE" \
            --hooks-dir "$RUNNER_TEMP/trusted/.factory/hooks"
      - name: Render the prompt (issue text is wrapped as untrusted data)
        id: render
        run: |
          python3 -I - "$RUNNER_TEMP" <<'EOF'
          import json, sys
          t = sys.argv[1]
          gate = json.load(open(f"{t}/state/handoff.json")).get("handoff") or {}
          json.dump({"gate_level": gate.get("gate_level") or "full",
                     "base_sha": open(f"{t}/evidence/base_sha.txt").read().strip(),
                     "run_id": "${{ github.run_id }}"}, open(f"{t}/run/extra.json", "w"))
          EOF
          python3 -I .factory/scripts/factory.py render-prompt --template .factory/prompts/implement.md \
            --issue-json "$RUNNER_TEMP/state/issue.json" --handoff-json "$RUNNER_TEMP/state/handoff.json" \
            --extra-json "$RUNNER_TEMP/run/extra.json" --out "$RUNNER_TEMP/run/prompt.md"
          delim="EOF_$(openssl rand -hex 16)"
          { echo "prompt<<$delim"; cat "$RUNNER_TEMP/run/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          GL="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["gate_level"])' "$RUNNER_TEMP/run/extra.json")"
          echo "FACTORY_GATE_LEVEL=$GL" >> "$GITHUB_ENV"
          echo "FACTORY_RUN_DIR=$RUNNER_TEMP/run" >> "$GITHUB_ENV"
      - name: Implementer (Claude Code, sandboxed, no network)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1 (2026-11-04)
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: ${{ steps.render.outputs.prompt }}
          settings: ${{ runner.temp }}/run/worker-settings.json
          display_report: "false"
          claude_args: >-
            --model ${{ steps.policy.outputs.model }}
            --max-turns ${{ steps.policy.outputs.turns }}
            --max-budget-usd ${{ steps.policy.outputs.budget }}
            --permission-mode dontAsk
            --json-schema '${{ env.IMPLEMENT_SCHEMA }}'
      - name: Collect the hand-back
        id: collect
        if: always()
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          printf '%s' "${STRUCTURED:-}" > "$RUNNER_TEMP/evidence/implement.json"
          [ -s "$RUNNER_TEMP/evidence/implement.json" ] || echo '{}' > "$RUNNER_TEMP/evidence/implement.json"
          python3 -I -c 'import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: d={}
          print("agent_status=" + str(d.get("status","none")))' "$RUNNER_TEMP/evidence/implement.json" >> "$GITHUB_OUTPUT"
      - name: Diff policy (trusted engine copy, never the working tree's)
        id: diff
        if: always()
        env:
          FACTORY_POLICY: ${{ runner.temp }}/trusted/.factory/policy.json
          GIT_DIR: ${{ runner.temp }}/trusted/git
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904   # empty tree: ignore .gitattributes
          ALLOWED_TIER: ${{ needs.preflight.outputs.allowed_tier }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          BASE="$(cat "$RUNNER_TEMP/evidence/base_sha.txt")"
          git add -A
          git diff --cached --binary --text --no-ext-diff --no-textconv "$BASE" -- . ':(exclude)docs/factory/runs' > "$RUNNER_TEMP/evidence/change.patch"
          git reset -q
          set +e
          python3 -I "$RUNNER_TEMP/trusted/.factory/scripts/factory.py" check-diff --base "$BASE" --max-tier "$ALLOWED_TIER" > "$RUNNER_TEMP/evidence/classify.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/evidence/classify.json"
          echo "patch_bytes=$(wc -c < "$RUNNER_TEMP/evidence/change.patch")" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$(sha256sum "$RUNNER_TEMP/evidence/change.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ok=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "gate_level=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["gate_level"])' "$RUNNER_TEMP/evidence/classify.json")" >> "$GITHUB_OUTPUT"
          echo "tier=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["tier"])' "$RUNNER_TEMP/evidence/classify.json")" >> "$GITHUB_OUTPUT"
          echo "tests_only=$(python3 -I -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["tests_only"]).lower())' "$RUNNER_TEMP/evidence/classify.json")" >> "$GITHUB_OUTPUT"
      - name: Run record (implementer)
        id: record
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          python3 -I "$RUNNER_TEMP/trusted/.factory/scripts/factory.py" ledger --execution-file "${EXEC_FILE:-/nonexistent}" \
            --schema-expected --out "$RUNNER_TEMP/evidence/record-implement.json" \
            --meta run_id=${{ github.run_id }} --meta repo=${{ github.repository }} --meta issue="$ISSUE" \
            --meta role=implement --meta step_outcome="$CLAUDE_OUTCOME" \
            --meta harness_action_sha="$CLAUDE_ACTION_SHA" > "$RUNNER_TEMP/run/ledger-out.json"
          cat "$RUNNER_TEMP/run/ledger-out.json"
          echo "agent_failed=$(python3 -I -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["agent_failed"]).lower())' "$RUNNER_TEMP/run/ledger-out.json")" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/state/issue.json" "$RUNNER_TEMP/evidence/issue.json"
          cp "$RUNNER_TEMP/state/handoff.json" "$RUNNER_TEMP/evidence/handoff.json"
          # Trajectory monitor (Phase C): advisory flags for the reviewer, never a reward signal.
          python3 -I "$RUNNER_TEMP/trusted/.factory/scripts/observe.py" monitor --execution-file "${EXEC_FILE:-/nonexistent}" \
            > "$RUNNER_TEMP/evidence/monitor.json" || echo '{"findings": [], "flagged": false}' > "$RUNNER_TEMP/evidence/monitor.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-implement-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30

  # Optional holdout scenarios (Phase B; PRAC-01, VER-13): acceptance checks kept in a separate
  # repository the agent never sees. Fetched here, in a job that runs no agent or candidate code,
  # with a read-only token minted from a GitHub App key; handed to the gates job as an artifact.
  holdouts:
    needs: [preflight, implement]
    if: vars.FACTORY_HOLDOUT_REPO != '' && needs.implement.outputs.diff_ok == 'true' && needs.implement.outputs.patch_bytes != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Holdout scenarios token
        id: holdout-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_HOLDOUT_APP_ID }}
          private-key: ${{ secrets.FACTORY_HOLDOUT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.FACTORY_HOLDOUT_REPO }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.FACTORY_HOLDOUT_REPO }}
          token: ${{ steps.holdout-token.outputs.token }}
          path: holdouts
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holdouts-${{ github.run_id }}
          path: holdouts
          include-hidden-files: false
          retention-days: 1

  gates:
    needs: [preflight, implement, holdouts]
    if: >-
      always() && needs.implement.result == 'success' && needs.implement.outputs.diff_ok == 'true' &&
      needs.implement.outputs.patch_bytes != '0' &&
      (needs.holdouts.result == 'success' || needs.holdouts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read               # no secrets, no id-token: agent code runs here
    outputs:
      diff_ok: ${{ steps.policy.outputs.ok }}
      tier: ${{ steps.policy.outputs.tier }}
      gates_status: ${{ steps.gates.outputs.status }}
      proof_status: ${{ steps.proof.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Everything that runs with network or sudo happens here, BEFORE the candidate patch is
      # applied, from the base commit only (review finding 2026-11-04: the candidate's lockfile
      # must never choose what runs outside the sandbox).
      - name: Sandbox and browsers from the base commit (before the candidate exists)
        env:
          LEVEL: ${{ needs.implement.outputs.gate_level }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          if [ "$LEVEL" = "ui" ] || [ "$LEVEL" = "deep" ]; then
            v="$(python3 -I -c 'import json; l=json.load(open("package-lock.json")); print(((l.get("packages") or {}).get("node_modules/@playwright/test") or {}).get("version",""))')"
            if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
              PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" npm exec --yes --package="playwright@$v" -- playwright install --with-deps chromium
            else
              echo "::warning::no @playwright/test in the base lockfile; the e2e gate will report MISCONFIGURED"
            fi
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-implement-${{ github.run_id }}
          path: ${{ runner.temp }}/implement
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.holdouts.result == 'success'
        with:
          name: holdouts-${{ github.run_id }}
          path: ${{ runner.temp }}/holdouts
      - name: Check the patch hash, copy the trusted engine, apply the patch
        env:
          EXPECTED_SHA256: ${{ needs.implement.outputs.patch_sha256 }}
          HOLDOUTS: ${{ needs.holdouts.result }}
        run: |
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/implement/change.patch" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence"
          cp -R .factory "$RUNNER_TEMP/trusted-factory"
          if [ "$HOLDOUTS" = "success" ]; then
            chmod +x "$RUNNER_TEMP/holdouts/run.sh" 2>/dev/null || true
            echo "FACTORY_HOLDOUT_DIR=$RUNNER_TEMP/holdouts" >> "$GITHUB_ENV"
          fi
          git -c user.name=factory -c user.email=factory@localhost apply --index --whitespace=nowarn "$RUNNER_TEMP/implement/change.patch"
      - name: Diff policy, authoritative (base engine and policy, before any agent code runs)
        id: policy
        env:
          FACTORY_POLICY: ${{ runner.temp }}/trusted-factory/policy.json
          ALLOWED_TIER: ${{ needs.preflight.outputs.allowed_tier }}
        run: |
          set +e
          python3 -I "$RUNNER_TEMP/trusted-factory/scripts/factory.py" check-diff --base HEAD --max-tier "$ALLOWED_TIER" > "$RUNNER_TEMP/evidence/classify.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/evidence/classify.json"
          echo "ok=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          for k in tier gate_level; do
            echo "$k=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$RUNNER_TEMP/evidence/classify.json" "$k")" >> "$GITHUB_OUTPUT"
          done
          echo "tests_only=$(python3 -I -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["tests_only"]).lower())' "$RUNNER_TEMP/evidence/classify.json")" >> "$GITHUB_OUTPUT"
          git -c user.name=factory -c user.email=factory@localhost commit -q -m "factory candidate"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dependencies (lockfile already checked by the diff policy; no install scripts)
        if: steps.policy.outputs.ok == 'true'
        run: npm ci --ignore-scripts
      - name: Gates (authoritative verdict, sandboxed)
        id: gates
        if: steps.policy.outputs.ok == 'true'
        env:
          LEVEL: ${{ steps.policy.outputs.gate_level }}
          FACTORY_GATES_CONF: ${{ runner.temp }}/trusted-factory/gates.conf
          FACTORY_POLICY: ${{ runner.temp }}/trusted-factory/policy.json
          SANDBOX_KEEP_ENV: FACTORY_GATES_CONF FACTORY_POLICY PLAYWRIGHT_BROWSERS_PATH FACTORY_HOLDOUT_DIR
          SANDBOX_RO_GIT: "1"
          CANDIDATE: ${{ steps.policy.outputs.candidate }}
        run: |
          set +e
          bash "$RUNNER_TEMP/trusted-factory/scripts/sandbox-exec.sh" "$GITHUB_WORKSPACE" -- \
            bash "$RUNNER_TEMP/trusted-factory/scripts/gates.sh" "$LEVEL" > "$RUNNER_TEMP/gates.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gates.log"
          # The verdict is the trusted script's exit code, read outside the sandbox. The log line
          # is evidence only: code under test shares stdout and could print a forged line.
          line="$(grep '^FACTORY_GATES:' "$RUNNER_TEMP/gates.log" | tail -1)"
          case "$code" in 0) status=GREEN ;; 1) status=RED ;; *) status=MISCONFIGURED ;; esac
          case "$line" in *"status=$status "*) ;; *) [ "$status" = GREEN ] && status=MISCONFIGURED ;; esac
          [ "$(git rev-parse HEAD)" = "$CANDIDATE" ] || status=MISCONFIGURED
          [ "$code" -eq 125 ] && line="sandbox unavailable"
          echo "FACTORY_GATES: level=$LEVEL status=$status exit=$code | ${line:-no verdict line}" > "$RUNNER_TEMP/evidence/gates.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Failing-test proof (rung 3, sandboxed)
        id: proof
        if: steps.policy.outputs.ok == 'true'
        env:
          TIER: ${{ steps.policy.outputs.tier }}
          TESTS_ONLY: ${{ steps.policy.outputs.tests_only }}
          SANDBOX_RO_GIT: "1"
          BASE_SHA: ${{ needs.implement.outputs.base_sha }}
          CANDIDATE: ${{ steps.policy.outputs.candidate }}
        run: |
          if [ "$TIER" = "0" ]; then
            echo "PROOF: status=NOT_REQUIRED reason=tier-0-docs-or-dependency-bump" > "$RUNNER_TEMP/evidence/proof.txt"
          elif [ "$TESTS_ONLY" = "true" ]; then
            echo "PROOF: status=NOT_REQUIRED reason=new-tests-only" > "$RUNNER_TEMP/evidence/proof.txt"
          else
            set +e
            bash "$RUNNER_TEMP/trusted-factory/scripts/sandbox-exec.sh" "$GITHUB_WORKSPACE" -- \
              bash "$RUNNER_TEMP/trusted-factory/scripts/prove-test.sh" "$BASE_SHA" -- npm test > "$RUNNER_TEMP/proof.log" 2>&1
            code=$?
            set -e
            cat "$RUNNER_TEMP/proof.log"
            # As for the gates: the status is the trusted script's exit code, not a log line.
            line="$(grep '^PROOF:' "$RUNNER_TEMP/proof.log" | tail -1)"
            case "$code" in 0) st=PROVEN ;; 1) st=FAILED ;; *) st=MISCONFIGURED ;; esac
            case "$line" in *"status=$st"*) ;; *) [ "$st" = PROVEN ] && st=MISCONFIGURED ;; esac
            [ "$(git rev-parse HEAD)" = "$CANDIDATE" ] || st=MISCONFIGURED
            git diff --quiet HEAD || st=MISCONFIGURED            # tree must be restored exactly
            echo "PROOF: status=$st exit=$code | ${line:-no proof line}" > "$RUNNER_TEMP/evidence/proof.txt"
          fi
          cat "$RUNNER_TEMP/evidence/proof.txt"
          echo "status=$(sed -n 's/^PROOF: status=\([A-Z_]*\).*/\1/p' "$RUNNER_TEMP/evidence/proof.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-gates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence/classify.json
            ${{ runner.temp }}/evidence/gates.txt
            ${{ runner.temp }}/evidence/proof.txt
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.policy.outputs.gate_level == 'ui' || steps.policy.outputs.gate_level == 'deep')
        with:
          name: evidence-e2e-${{ github.run_id }}     # traces, screenshots, video (rung 5)
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30

  verify:
    needs: [preflight, implement, gates]
    if: needs.gates.outputs.diff_ok == 'true' && needs.gates.outputs.gates_status == 'GREEN' && (needs.gates.outputs.proof_status == 'PROVEN' || needs.gates.outputs.proof_status == 'NOT_REQUIRED')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      FACTORY_RUN: "1"
    steps:
      - name: Refuse static Anthropic credentials
        run: |
          test -z "${ANTHROPIC_API_KEY:-}" || { echo "::error::ANTHROPIC_API_KEY must not exist (federation only)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      # Artifacts are downloaded by exact name (never by pattern), implement first, then gates,
      # so the gates job's authoritative classify.json replaces the implement job's.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-implement-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Apply the candidate and render the verifier prompt
        id: render
        env:
          EXPECTED_SHA256: ${{ needs.implement.outputs.patch_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/evidence/change.patch" | sha256sum -c -
          cp -R .factory "$RUNNER_TEMP/trusted-factory"
          BASE="$(cat "$RUNNER_TEMP/evidence/base_sha.txt")"
          git -c user.name=factory -c user.email=factory@localhost apply --index --whitespace=nowarn "$RUNNER_TEMP/evidence/change.patch"
          git -c user.name=factory -c user.email=factory@localhost commit -q -m "factory candidate"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 -I - "$RUNNER_TEMP" "$BASE" <<'EOF'
          import json, sys, subprocess
          t, base = sys.argv[1], sys.argv[2]
          stat = subprocess.run(["git", "diff", "--stat", base], capture_output=True, text=True).stdout
          json.dump({"base_sha": base, "run_id": "${{ github.run_id }}", "diff_stat": stat,
                     "gates_line": open(f"{t}/evidence/gates.txt").read().strip(),
                     "proof_line": open(f"{t}/evidence/proof.txt").read().strip(),
                     "gate_level": "full"}, open(f"{t}/extra.json", "w"))
          EOF
          python3 -I "$RUNNER_TEMP/trusted-factory/scripts/factory.py" render-prompt --template "$RUNNER_TEMP/trusted-factory/prompts/verify.md" \
            --issue-json "$RUNNER_TEMP/evidence/issue.json" --handoff-json "$RUNNER_TEMP/evidence/handoff.json" \
            --extra-json "$RUNNER_TEMP/extra.json" --out "$RUNNER_TEMP/verify-prompt.md"
          delim="EOF_$(openssl rand -hex 16)"
          { echo "prompt<<$delim"; cat "$RUNNER_TEMP/verify-prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open(".factory/policy.json"))
          print("model=" + p["models"]["verifier"])
          print("budget=" + str(p["limits"]["verify_run_budget_usd"]))
          print("turns=" + str(p["limits"]["verify_run_max_turns"]))
          EOF
          echo "VERIFY_SCHEMA=$(cat .factory/schemas/verify.schema.min.json)" >> "$GITHUB_ENV"
          python3 -I "$RUNNER_TEMP/trusted-factory/scripts/factory.py" render-settings --in "$RUNNER_TEMP/trusted-factory/verifier-settings.json" \
            --out "$RUNNER_TEMP/verifier-settings.json" --root "$GITHUB_WORKSPACE"
      - name: Verifier (different model, fresh context, read-only)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1 (2026-11-04)
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: ${{ steps.render.outputs.prompt }}
          settings: ${{ runner.temp }}/verifier-settings.json
          display_report: "false"
          claude_args: >-
            --model ${{ steps.render.outputs.model }}
            --max-turns ${{ steps.render.outputs.turns }}
            --max-budget-usd ${{ steps.render.outputs.budget }}
            --permission-mode dontAsk
            --json-schema '${{ env.VERIFY_SCHEMA }}'
      - name: Save verdict and run record (verifier)
        if: always()
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "${STRUCTURED:-}" > "$RUNNER_TEMP/out/verdict.json"
          [ -s "$RUNNER_TEMP/out/verdict.json" ] || echo '{}' > "$RUNNER_TEMP/out/verdict.json"
          python3 -I "$RUNNER_TEMP/trusted-factory/scripts/factory.py" ledger --execution-file "${EXEC_FILE:-/nonexistent}" \
            --schema-expected --out "$RUNNER_TEMP/out/record-verify.json" --meta role=verify --meta run_id=${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  publish:
    needs: [preflight, implement, gates, verify]
    if: always() && needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write              # branch push and the factory/ledger branch
      pull-requests: write
      issues: write
      statuses: write
    env:
      RUN_ID: ${{ github.run_id }}
      ISSUE: ${{ needs.preflight.outputs.issue }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Phase F, optional: publish as a dedicated GitHub App (per-run installation token) instead
      # of GITHUB_TOKEN. PRs opened by an App trigger the gates, security and preview workflows;
      # PRs opened with GITHUB_TOKEN do not. The token is scoped to this repository and expires.
      - name: Per-run publishing identity (optional)
        id: publish-token
        if: vars.FACTORY_PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_PUBLISH_APP_ID }}
          private-key: ${{ secrets.FACTORY_PUBLISH_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - name: Select the publishing token
        env:
          APP_TOKEN: ${{ steps.publish-token.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then echo "::add-mask::$APP_TOKEN"; echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
          else echo "GH_TOKEN=$JOB_TOKEN" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token || github.token }}
      - name: Copy the default branch's factory scripts (publish never runs candidate code)
        run: cp -R .factory "$RUNNER_TEMP/trusted-main"
      # Exact names, in order: implement, gates (authoritative classify.json), verify.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: evidence-implement-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gates.result == 'success'
        continue-on-error: true
        with:
          name: evidence-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify.result == 'success'
        continue-on-error: true
        with:
          name: evidence-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Decide the outcome
        id: outcome
        env:
          DIFF_OK: ${{ needs.implement.outputs.diff_ok }}
          GATES_DIFF_OK: ${{ needs.gates.outputs.diff_ok }}
          GATES_RESULT: ${{ needs.gates.result }}
          EXPECTED_SHA256: ${{ needs.implement.outputs.patch_sha256 }}
          PATCH_BYTES: ${{ needs.implement.outputs.patch_bytes }}
          AGENT_STATUS: ${{ needs.implement.outputs.agent_status }}
          GATES: ${{ needs.gates.outputs.gates_status }}
          PROOF: ${{ needs.gates.outputs.proof_status }}
          IMPL_RESULT: ${{ needs.implement.result }}
          AGENT_FAILED: ${{ needs.implement.outputs.agent_failed }}
        run: |
          EV="$RUNNER_TEMP/evidence"
          for f in verdict.json implement.json; do [ -f "$EV/$f" ] || echo '{}' > "$EV/$f"; done
          for f in gates.txt proof.txt; do [ -f "$EV/$f" ] || echo "(not run)" > "$EV/$f"; done
          if [ "$IMPL_RESULT" != "success" ] || [ "$AGENT_FAILED" = "true" ]; then outcome="agent-failed"
          elif [ "${AGENT_STATUS:-none}" != "done" ]; then outcome="escalated"
          elif [ "${PATCH_BYTES:-0}" = "0" ]; then outcome="no-change"
          elif [ "$DIFF_OK" != "true" ]; then outcome="policy-blocked"
          elif [ "$GATES_RESULT" != "success" ]; then outcome="misconfigured"     # hash, apply or runner failure
          elif ! echo "$EXPECTED_SHA256  $EV/change.patch" | sha256sum -c - >/dev/null 2>&1; then outcome="misconfigured"
          elif [ "$GATES_DIFF_OK" != "true" ]; then outcome="policy-blocked"
          elif [ "$GATES" = "MISCONFIGURED" ] || [ "$PROOF" = "MISCONFIGURED" ]; then outcome="misconfigured"
          elif [ "$GATES" != "GREEN" ]; then outcome="red"
          elif [ "$PROOF" != "PROVEN" ] && [ "$PROOF" != "NOT_REQUIRED" ]; then outcome="red"
          else outcome="publish"; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Outcome: $outcome (agent status: ${AGENT_STATUS:-none})" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish a draft pull request
        id: pub
        if: steps.outcome.outputs.outcome == 'publish'
        run: |
          set +e
          bash "$RUNNER_TEMP/trusted-main/scripts/publish.sh" "$RUNNER_TEMP/evidence"
          code=$?
          set -e
          if [ $code -eq 3 ]; then echo "final=claimed-elsewhere" >> "$GITHUB_OUTPUT";
          elif [ $code -ne 0 ]; then echo "final=publish-failed" >> "$GITHUB_OUTPUT";
          else echo "final=published" >> "$GITHUB_OUTPUT"; fi
      - name: Report a non-published outcome on the issue
        if: steps.outcome.outputs.outcome != 'publish' || steps.pub.outputs.final != 'published'
        env:
          OUTCOME: ${{ steps.pub.outputs.final || steps.outcome.outputs.outcome }}
        run: |
          EV="$RUNNER_TEMP/evidence"
          reasons="$(python3 -I -c 'import json,sys
          try: print(", ".join(json.load(open(sys.argv[1])).get("stop_reasons") or []) or "none")
          except Exception: print("n/a")' "$EV/classify.json")"
          agent_reason="$(python3 -I -c 'import json,sys
          try: d=json.load(open(sys.argv[1])); print((d.get("status","") + ": " + d.get("reason",""))[:300])
          except Exception: print("")' "$EV/implement.json")"
          # factory:in-progress was set by this run's claim job (one implement run at a time:
          # concurrency group factory-implement), so removing it here releases our own claim.
          # claimed-elsewhere means the branch claude/fq-N already exists: a human decides.
          case "$OUTCOME" in
            red|misconfigured) label_args="--remove-label factory:in-progress" ;;     # retry allowed until RED_GATES_TWICE
            *) label_args="--add-label factory:needs-human --remove-label factory:ready-to-implement --remove-label factory:in-progress" ;;
          esac
          gh issue edit "$ISSUE" -R "$REPO" $label_args || true
          {
            echo "Factory run outcome: **$OUTCOME**"
            echo ""
            echo "- Gates: \`$(cat "$EV/gates.txt")\`"
            echo "- Proof: \`$(cat "$EV/proof.txt")\`"
            echo "- Diff policy stop reasons: \`$reasons\`"
            echo "- Implementer: ${agent_reason:-n/a}"
            echo ""
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
      - name: Final run record to the ledger
        if: always()
        env:
          OUTCOME: ${{ steps.pub.outputs.final || steps.outcome.outputs.outcome }}
        run: |
          EV="$RUNNER_TEMP/evidence"
          python3 -I - "$EV" <<'EOF'
          import json, os, sys, pathlib
          ev = pathlib.Path(sys.argv[1])
          def j(n):
              try: return json.loads((ev / n).read_text())
              except Exception: return {}
          def t(n):
              p = ev / n
              return p.read_text().strip() if p.exists() else None
          rec = j("record-implement.json")
          cls = j("classify.json")
          rec.update({
              "outcome": os.environ.get("OUTCOME"),
              "tier": cls.get("tier"), "gate_level": cls.get("gate_level"),
              "diff_policy": {"ok": cls.get("ok"), "stop_reasons": cls.get("stop_reasons")},
              "changed_lines": cls.get("changed_lines"), "file_count": cls.get("file_count"),
              "gates_line": t("gates.txt"), "proof_line": t("proof.txt"),
              "verdict": j("verdict.json").get("decision"),
              "verify_agent": j("record-verify.json").get("agent"),
              "pr_number": t("pr-number.txt"),
              "head_sha": t("head-sha.txt"),
              "implementer_status": j("implement.json").get("status"),
              "monitor": j("monitor.json"),
          })
          (ev / "record.json").write_text(json.dumps(rec, indent=2, sort_keys=True))
          EOF
          git checkout --quiet --force "${{ github.sha }}"
          bash "$RUNNER_TEMP/trusted-main/scripts/ledger-commit.sh" "$EV/record.json" "${RUN_ID}-${GITHUB_RUN_ATTEMPT}"
