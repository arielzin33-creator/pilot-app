# factory-preview: a preview deployment per pull request (Phase D deliverable 1; LIFE-38).
# Same-repository PRs only (fork PRs never receive the preview environment's secrets). The
# image build runs the PR's code inside Docker; the deploy job gets only the image digest.
# Previews are torn down by the provider's own expiry (see MANUAL-CONNECTIONS.md).
# Factory branches (claude/*) carry unreviewed agent code: they get a preview only after a human
# adds the label factory:preview. Preview images are attested and verified like releases.

name: factory-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: factory-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEPLOY_PROVIDER != '' && vars.DEPLOY_PROVIDER != 'none' &&
      (!startsWith(github.event.pull_request.head.ref, 'claude/') ||
       contains(github.event.pull_request.labels.*.name, 'factory:preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write               # keyless signing of the preview image's provenance
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-preview" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:pr-${{ github.event.pull_request.number }}
          build-args: RELEASE=pr-${{ github.event.pull_request.number }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
    permissions:
      contents: read
      packages: read
      attestations: read
      pull-requests: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      DEPLOY_PROVIDER: ${{ vars.DEPLOY_PROVIDER }}
      DEPLOY_APP_PREVIEW: ${{ vars.DEPLOY_APP_PREVIEW }}
      DEPLOY_URL_PREVIEW: ${{ vars.DEPLOY_URL_PREVIEW }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # base-branch scripts; the PR's code is only in the image
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Admission - verify the preview image's provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .factory/deploy/admit.sh "$IMAGE" factory-preview.yml
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: vars.DEPLOY_PROVIDER == 'fly'
      - name: Deploy preview
        id: deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET_PREVIEW }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          RELEASE: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          bash .factory/deploy/deploy.sh preview "$IMAGE" --pr "$PR" | tee "$RUNNER_TEMP/deploy.log"
          url="$(sed -n 's/^FACTORY_DEPLOY: .* url=\([^ ]*\) status=.*/\1/p' "$RUNNER_TEMP/deploy.log" | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify the preview
        if: steps.deploy.outputs.url != ''
        run: bash .factory/deploy/verify.sh "${{ steps.deploy.outputs.url }}" "pr-$PR"
      - name: Comment the preview URL
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --body "Preview: $URL (image \`${IMAGE##*@}\`)" 2>/dev/null \
            || gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Preview: $URL (image \`${IMAGE##*@}\`)"
