# factory-triage: classify inbox issues and write the factory-handoff:v1 comment.
#
# The triage agent is read-only and returns structured output; deterministic steps apply the
# tier classifier (which the LLM can raise but never lower) and write labels and the handoff.
# Only issues authored by OWNER/MEMBER/COLLABORATOR are triaged: issue text is untrusted input,
# and on a public repository anyone can open an issue (spec §6, threat T1).

name: factory-triage

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (blank = all inbox issues, up to 5)"
        required: false
        default: ""
  schedule:
    - cron: "41 5 * * 1-5"

permissions: {}

concurrency:
  group: factory-triage
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'issues' || github.event.label.name == 'factory:inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: Pick trusted inbox issues
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$ONE" ]; then
            gh api "repos/$REPO/issues/$ONE" --jq '[{number: .number, assoc: .author_association, login: .user.login, labels: [.labels[].name]}]' > issues.json
          else
            gh api "repos/$REPO/issues?state=open&labels=factory:inbox&per_page=20" \
              --jq '[.[] | select(.pull_request == null) | {number: .number, assoc: .author_association, login: .user.login, labels: [.labels[].name]}]' > issues.json
          fi
          python3 -I - <<'EOF'
          import json, os
          issues = json.load(open("issues.json"))
          # Issues opened by the factory's own incident intake (github-actions[bot], sanitised
          # alert text, label factory:incident) are triaged like a member's issue.
          def ok(i):
              return i["assoc"] in ("OWNER", "MEMBER", "COLLABORATOR") or (
                  i.get("login") == "github-actions[bot]" and "factory:incident" in i["labels"])
          trusted = [i["number"] for i in issues if ok(i) and "factory:inbox" in i["labels"]][:5]
          external = [i["number"] for i in issues if not ok(i) and "factory:inbox" in i["labels"]]
          json.dump(external, open("external.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"issue": trusted}) + "\n")
              fh.write("any=" + ("true" if trusted else "false") + "\n")
          EOF
          for n in $(python3 -I -c 'import json; print(" ".join(map(str, json.load(open("external.json")))))'); do
            gh issue edit "$n" -R "$REPO" --remove-label factory:inbox --add-label factory:needs-human
            gh issue comment "$n" -R "$REPO" --body "This issue was opened by someone outside the project, so the factory will not triage it automatically. A maintainer will review it."
          done

  triage:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      FACTORY_RUN: "1"
    steps:
      - name: Refuse static Anthropic credentials
        run: |
          test -z "${ANTHROPIC_API_KEY:-}" || { echo "::error::ANTHROPIC_API_KEY must not exist (federation only)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Trust check and prompt
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ matrix.issue }}
        run: |
          python3 -I .factory/scripts/factory.py config-hashes
          mkdir -p "$RUNNER_TEMP/t"
          cp -R .factory "$RUNNER_TEMP/trusted-factory"
          gh issue view "$ISSUE" -R "$REPO" --json number,title,body > "$RUNNER_TEMP/t/issue.json"
          python3 -I .factory/scripts/factory.py render-prompt --template .factory/prompts/triage.md \
            --issue-json "$RUNNER_TEMP/t/issue.json" --out "$RUNNER_TEMP/t/prompt.md"
          delim="EOF_$(openssl rand -hex 16)"
          { echo "prompt<<$delim"; cat "$RUNNER_TEMP/t/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open(".factory/policy.json"))
          print("model=" + p["models"]["triage"])
          print("budget=" + str(p["limits"]["triage_run_budget_usd"]))
          print("turns=" + str(p["limits"]["triage_run_max_turns"]))
          EOF
          echo "TRIAGE_SCHEMA=$(cat .factory/schemas/triage.schema.min.json)" >> "$GITHUB_ENV"
          python3 -I .factory/scripts/factory.py render-settings --in .factory/verifier-settings.json \
            --out "$RUNNER_TEMP/t/settings.json" --root "$GITHUB_WORKSPACE"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Triage agent (read-only)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1 (2026-11-04)
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: ${{ steps.render.outputs.prompt }}
          settings: ${{ runner.temp }}/t/settings.json
          display_report: "false"
          claude_args: >-
            --model ${{ steps.render.outputs.model }}
            --max-turns ${{ steps.render.outputs.turns }}
            --max-budget-usd ${{ steps.render.outputs.budget }}
            --permission-mode dontAsk
            --json-schema '${{ env.TRIAGE_SCHEMA }}'
      - name: Save triage output and run record
        if: always()
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          ISSUE: ${{ matrix.issue }}
        run: |
          printf '%s' "${STRUCTURED:-}" > "$RUNNER_TEMP/t/triage.json"
          [ -s "$RUNNER_TEMP/t/triage.json" ] || echo '{}' > "$RUNNER_TEMP/t/triage.json"
          python3 -I "$RUNNER_TEMP/trusted-factory/scripts/factory.py" ledger --execution-file "${EXEC_FILE:-/nonexistent}" \
            --schema-expected --out "$RUNNER_TEMP/t/record.json" \
            --meta role=triage --meta run_id=${{ github.run_id }} --meta issue="$ISSUE" --meta repo=${{ github.repository }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: triage-${{ github.run_id }}-${{ matrix.issue }}
          path: ${{ runner.temp }}/t
          retention-days: 30

  apply:
    needs: [select, triage]
    if: always() && needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write             # factory/ledger branch only
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: triage-${{ github.run_id }}-*
          path: ${{ runner.temp }}/triage
      - name: Classify, write handoff comments and labels
        run: |
          for dir in "$RUNNER_TEMP"/triage/triage-*; do
            [ -d "$dir" ] || continue
            ISSUE="${dir##*-}"
            python3 -I - "$dir" "$ISSUE" <<'EOF'
          import json, re, subprocess, sys, datetime as dt, pathlib
          d, issue = pathlib.Path(sys.argv[1]), sys.argv[2]
          try:
              t = json.loads((d / "triage.json").read_text())
          except Exception:
              t = {}
          # Model output: one path per entry, no whitespace or commas (a newline here could
          # otherwise forge extra handoff lines; the parser also rejects repeated fields).
          files = [f.strip() for f in t.get("files_expected", []) or []
                   if isinstance(f, str) and f.strip() and not re.search(r"[\s,]", f.strip())]
          pred = json.loads(subprocess.run(
              ["python3", "-I", ".factory/scripts/factory.py", "predict-tier", "--files", ",".join(files)],
              capture_output=True, text=True).stdout or "{}")
          tier = int(pred.get("tier", 3))
          # LLM opinion is raise-only (Phase B, PRAC-14): it can make a tier higher, never lower.
          llm_tier = t.get("suggested_tier")
          if isinstance(llm_tier, int) and 0 <= llm_tier <= 3 and llm_tier > tier:
              tier = llm_tier
          disp = t.get("disposition") or "needs-info"
          # The deterministic classifier can only make the disposition more conservative.
          if not t:
              disp = "needs-info"
          if disp == "ready-to-implement":
              if pred.get("violations") or tier >= 3:
                  disp = "human-only"
              elif tier == 2:
                  disp = "ready-to-spec"
              elif not files or not t.get("done_when") or t.get("confidence") == "low":
                  disp = "needs-info"
          if tier >= 3 and disp in ("ready-to-spec",):
              disp = "human-only"
          handoff = "\n".join([
              "<!-- factory-handoff:v1 -->",
              "```text",
              f"disposition: {disp}",
              f"done_when: {' '.join(str(t.get('done_when','')).split())[:400]}",
              f"files_expected: {','.join(files)[:400]}",
              f"predicted_tier: {tier}",
              f"load_bearing: {'true' if 'LOAD_BEARING_TOUCHED' in (pred.get('violations') or []) else 'false'}",
              f"gate_level: {'ui' if tier == 2 else (t.get('gate_level') if t.get('gate_level') in ('fast','full') else 'full')}",
              f"confidence: {t.get('confidence') if t.get('confidence') in ('high','medium','low') else 'low'}",
              f"triaged_at: {dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}",
              "```",
              "",
              f"Rationale (triage agent, advisory): {' '.join(str(t.get('rationale','')).split())[:600]}",
          ])
          if disp == "needs-info" and t.get("question"):
              handoff += f"\n\n**Question for the author:** {' '.join(str(t['question']).split())[:400]}"
          (d / "handoff.md").write_text(handoff)
          (d / "disposition.txt").write_text(disp)
          (d / "tier.txt").write_text(str(tier))
          EOF
            DISP="$(cat "$dir/disposition.txt")"; TIER="$(cat "$dir/tier.txt")"
            existing="$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
              --jq '[.[] | select(.user.login=="github-actions[bot]" and (.body | contains("factory-handoff:v1")))] | last | .id // empty')"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$dir/handoff.md" >/dev/null
            else
              gh issue comment "$ISSUE" -R "$REPO" --body-file "$dir/handoff.md" >/dev/null
            fi
            gh issue edit "$ISSUE" -R "$REPO" --remove-label factory:inbox --add-label "factory:$DISP" --add-label "factory:tier-$TIER" >/dev/null
            echo "#$ISSUE -> $DISP (tier $TIER)" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$dir/record.json" ]; then
              python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); r["outcome"]=sys.argv[2]; r["tier"]=int(sys.argv[3]); json.dump(r,open(sys.argv[1],"w"),indent=2)' "$dir/record.json" "triaged-$DISP" "$TIER"
              bash .factory/scripts/ledger-commit.sh "$dir/record.json" "${GITHUB_RUN_ID}-triage-${ISSUE}"
            fi
          done
